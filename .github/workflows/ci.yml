
name: FastAPI CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Install, Test and Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # 4. Install project dependencies
      - name: Install dependencies
        run: uv sync --frozen

      # 5. Start the test database
      - name: Start PostgreSQL
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          touch .env
          docker compose -p ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -f docker-compose.yml up -d --wait postgres

      # 6. Run automated tests
      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run pytest -v

      # 7. Stop the test database
      - name: Stop PostgreSQL
        if: always()
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker compose -p ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -f docker-compose.yml down -v
          rm -f .env

      # 8. Validate Python syntax
      - name: Validate Python syntax
        run: |
          uv run python -m compileall -q apps main.py

      # 9. Validate Docker image build
      - name: Build Docker image
        run: docker build -t websocket-demo:ci .

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            git pull --ff-only origin "${{ github.ref_name }}"
            docker compose up -d --build
