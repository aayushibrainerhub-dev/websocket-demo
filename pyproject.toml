[project]
name = "websockets-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aayushibrainerhub-dev", email = "aayushi.brainerhub@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "aiosqlite>=0.21.0",
    "fastapi>=0.141.1",
    "python-jose[cryptography]>=3.5.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn>=0.35.0",
    "websockets>=17.1",
    "alembic>=1.19.2",
    "psycopg2-binary>=2.9.13",
    "websocket>=0.2.1",
    "langchain-groq>=1.1.3",
    "python-multipart>=0.0.9",
    "pydub>=0.25.1",
    "rapidfuzz>=3.14.6",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "ngrok>=1.4.0",
    "redis>=8.1.0",
    "livekit-api>=1.2.1",
    "aiokafka>=0.14.0",
]

[project.scripts]
websockets-demo = "websockets_demo:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
